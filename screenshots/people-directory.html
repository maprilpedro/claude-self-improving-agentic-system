  body{margin:0;padding:clamp(12px,2.5vw,24px);background:var(--bg);color:var(--text);

    border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
  button.f:hover{border-color:var(--muted)}
  button.f.active{font-weight:700;border-width:2px}
  button.f[data-p="all"].active{border-color:var(--text)}
  button.f[data-p="eh"].active{border-color:var(--eh);color:var(--eh)}
  button.f[data-p="aai"].active{border-color:var(--aai);color:var(--aai)}
  button.f[data-p="cross"].active{border-color:var(--cross);color:var(--cross)}
  input#q{background:var(--panel);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 12px;font-size:13px;min-width:200px;flex:1}
  .count{color:var(--muted);font-size:12px;margin-left:auto}
  .grp{margin:22px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;border-bottom:1px solid var(--border);padding-bottom:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--muted);
    border-radius:10px;padding:12px 14px}
  .card.eh{border-left-color:var(--eh)}
  .card.aai{border-left-color:var(--aai)}
  .card.cross{border-left-color:var(--cross)}
  .nm{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .tag.eh{background:rgba(78,164,255,.15);color:var(--eh)}
  .tag.aai{background:rgba(255,122,89,.15);color:var(--aai)}
  .tag.cross{background:rgba(74,222,128,.15);color:var(--cross)}
  .role{font-size:12.5px;margin:3px 0}
  .meta{color:var(--muted);font-size:11.5px;margin-top:5px}
  .st{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--chip);
    color:var(--muted);margin-right:6px}
  .st.Active{color:var(--cross)}
  .st.TBD{color:#facc15}
  .why{font-size:11.5px;color:#c3c8d4;margin-top:5px;font-style:italic}
  .hide{display:none}
</style>
</head>

const root=document.getElementById('root'), q=document.getElementById('q'), cnt=document.getElementById('count');
let pf='all';
function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const term=q.value.trim().toLowerCase();
  const rows=P.filter(x=>(pf==='all'||x.p===pf)&&
    (!term||(x.n+x.r+x.g+x.w+x.o).toLowerCase().includes(term)));
  const groups={};
  rows.forEach(x=>{(groups[x.g]=groups[x.g]||[]).push(x)});
  root.innerHTML=Object.keys(groups).sort().map(g=>
    `<div class="grp">${esc(g)} <span style="color:var(--muted)">(${groups[g].length})</span></div>
     <div class="grid">`+groups[g].map(x=>
      `<div class="card ${x.p}">
        <div class="nm">${esc(x.n)}<span class="tag ${x.p}">${x.p.toUpperCase()}</span></div>
        <div class="role">${esc(x.r)}</div>
        <div class="meta"><span class="st ${x.s.replace(/[^A-Za-z]/g,'')}">${esc(x.s)}</span>${esc(x.o)}</div>
        <div class="why">${esc(x.w)}</div>
      </div>`).join('')+`</div>`).join('');
  cnt.textContent=rows.length+' / '+P.length+' people';
}
